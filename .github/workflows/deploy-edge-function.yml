name: Deploy Supabase edge function

# The live site parses plays through supabase/functions/parse-play, and edits
# to it only take effect once deployed. This redeploys it whenever it changes
# on main, and can be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # optional. with it the function parses with Groq, well under a second;
      # without it, the slower Lovable gateway
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check the access token is set
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Add a repository secret named SUPABASE_ACCESS_TOKEN (Settings > Secrets and variables > Actions)."
          exit 1

      - uses: actions/checkout@v4

      # the project comes from supabase/config.toml, the same file the CLI
      # reads, so switching projects never means editing this workflow
      - name: Read the project from supabase/config.toml
        run: |
          ref=$(grep '^project_id' supabase/config.toml | cut -d'"' -f2)
          if [ -z "$ref" ]; then echo "::error::project_id is missing from supabase/config.toml"; exit 1; fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # includes the check that the function carries the same prompt as
      # server/prompt.js, so a stale prompt never goes live
      - name: Test
        run: |
          npm ci --prefix server
          npm test --prefix server

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # asks only for what the deploy needs anyway, so a token scoped to Edge
      # Functions passes. fails with a plain message rather than a bare
      # "unauthorized" halfway through the deploy
      - name: Check the token can reach the project
        run: |
          if ! supabase functions list --project-ref "$PROJECT_REF" > /dev/null; then
            echo "::error::This access token can't reach project $PROJECT_REF. Check it was made on the Supabase account that owns the project and has Edge Functions (read-write) and Edge Function Secrets (read-write)."
            exit 1
          fi

      - name: Set the Groq key on the function
        if: env.GROQ_API_KEY != ''
        run: supabase secrets set GROQ_API_KEY="$GROQ_API_KEY" --project-ref "$PROJECT_REF"

      - name: Deploy parse-play
        run: supabase functions deploy parse-play --project-ref "$PROJECT_REF"

      # one real parse, so a deploy that is broken at runtime shows up here
      # rather than on the live site. the current function reports its model
      # and timing; the old one did not
      - name: Check the live function
        run: |
          started=$(date +%s%3N)
          reply=$(curl -s --max-time 60 -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/parse-play" \
            -H "Content-Type: application/json" \
            -d '{"transcript":"Soto singles to left"}')
          elapsed=$(( $(date +%s%3N) - started ))
          echo "$reply" | jq .
          echo "$reply" | jq -e '.play.action and .timing.model' > /dev/null \
            || { echo "::error::The deployed function did not return a play with timing"; exit 1; }
          echo "::notice::parse-play answered in ${elapsed}ms using $(echo "$reply" | jq -r .timing.model)"
