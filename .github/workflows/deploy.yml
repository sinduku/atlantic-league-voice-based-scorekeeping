name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deploy halfway through; queue the next one behind it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix server

      - name: Test
        run: |
          npm test
          npm test --prefix server

      # a static site cannot hold the AI key, so the live build parses plays
      # through the Supabase edge function instead of the Express server. the
      # function lives in whichever project .env points at, so switching
      # projects never means editing this file
      - name: Point the build at the Supabase project in .env
        run: |
          url=$(grep '^VITE_SUPABASE_URL=' .env | cut -d= -f2- | tr -d '"\r')
          if [ -z "$url" ]; then echo "::error::VITE_SUPABASE_URL is missing from .env"; exit 1; fi
          echo "VITE_PARSE_URL=$url/functions/v1/parse-play" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages has no single-page-app fallback, so unknown paths load the
      # app as well and React Router shows its own not-found page
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
